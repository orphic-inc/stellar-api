name: Publish packages to GHCR
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    # `labeled`/`unlabeled` are here so the changelog gate's `no-changelog`
    # escape hatch takes effect without a manual re-run (#386). Triggers are
    # workflow-scoped, so this does re-run every job on a label change —
    # acceptable because PR labels are rare here (the vocabulary in
    # docs/agents/triage-labels.md is for issues).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stellar
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: stellar
        ports:
          - 5432:5432
        # PGDATA on tmpfs: the CI database is disposable, so durability buys
        # nothing here, and the integration suite's cost is dominated by
        # TRUNCATE — relation-file work and fsync. Keeping it in RAM removes the
        # disk-I/O sensitivity that inflated one run to 68 minutes against a
        # 6-11 minute baseline (#458).
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1024m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STELLAR_PSQL_URI: postgresql://stellar:changeme@localhost:5432/stellar
      STELLAR_PSQL_URI_TEST: postgresql://stellar:changeme@localhost:5432/stellar_test
      STELLAR_AUTH_JWT_SECRET: ci-only-not-a-secret-pad-to-32-chars
      STELLAR_HTTP_PORT: 8080
      STELLAR_HTTP_CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Every gate below runs even when an earlier one failed. They are
      # independent checks, and by default the first failure cancels the rest —
      # which hid a real type error behind a formatting nit for twelve days on
      # the npm-non-major bump: `prettier --check` failed, so nothing after it
      # ran. Reordering does not fix that (eslint.config.mjs applies
      # eslint-plugin-prettier/recommended, so `lint` fails on the same
      # unformatted tree); running them independently does. `!cancelled()` still
      # honours a genuinely cancelled run, and the job fails if any gate failed.
      #
      # `npm ci` above is deliberately NOT in this set — every gate is
      # meaningless if the install did not happen.
      - name: Format check
        if: ${{ !cancelled() }}
        run: npx prettier --check src 'prisma/**/*.ts'
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
      - name: Type check (test files)
        if: ${{ !cancelled() }}
        run: npm run typecheck:test
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: OpenAPI freshness
        if: ${{ !cancelled() }}
        run: npm run openapi:export && git diff --exit-code openapi.json
      - name: OpenAPI completeness
        if: ${{ !cancelled() }}
        # Freshness above proves openapi.json matches the registry in
        # lib/openapi.ts. It cannot prove the registry matches the routes that
        # exist — the registry is manual, so an unregistered route is invisible
        # to the spec and to stellar-ui's generated types (#474 found 91).
        # Grandfathered gaps live in openapi-completeness-baseline.json; a NEW
        # unregistered route fails here, and so does a baseline entry that has
        # gone stale, so the list can only shrink.
        run: npm run openapi:completeness
      - name: OpenAPI failure coverage
        if: ${{ !cancelled() }}
        # The third registry axis (#517). Completeness proves a route is
        # registered, and buildOpenApiDocument derives what a route's GATES
        # answer. Neither can see what its HANDLER answers: 149
        # operations declare no 4xx their middleware does not already imply,
        # while the source emits 404 at 202 sites alone.
        #
        # Unlike its two siblings this gate derives nothing — 121 of 151
        # AppError throws are in modules, a call away from the route, so there
        # is no structure to read. The authority is a human reading the handler,
        # and this only asserts every operation has been CLASSIFIED: documented,
        # or recorded in openapi-failure-coverage-baseline.json as unreviewed
        # (the shrinking burn-down) or as verified-silent. A new route is in
        # neither list and fails on its first CI run.
        run: npm run openapi:failure-coverage
      - name: Prisma guard coverage
        if: ${{ !cancelled() }}
        # #564 — the global handler is `err.statusCode ?? 500` with FieldError
        # its only special case, so a Prisma constraint violation reports a
        # CLIENT mistake as a SERVER error, logged at error rather than warn.
        #
        # Two arms, and every count published for the issue described only the
        # first: create/upsert can violate an FK or @unique the model owns
        # (P2003/P2002), and update/delete addressed by id throw P2025 for a
        # missing row on ANY model, constrained or not.
        #
        # Gates src/routes only. src/modules is counted and reported: a module
        # takes ids as arguments, so request-supplied cannot be distinguished
        # from internally-read without inter-procedural analysis, and gating on
        # a rule that cannot discriminate would be noise, not a gate.
        run: npm run prisma:guard-coverage
      - name: ERD freshness
        if: ${{ !cancelled() }}
        run: npm run db:erd && git diff --exit-code docs/erd.md
      - name: Version consistency
        if: ${{ !cancelled() }}
        run: npm run version:check
      - name: Version consistency (tag)
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
        run: git fetch --tags --force && npm run version:check -- --check-tag
      # Changelog gate (#386): a PR touching shipping code must update
      # CHANGELOG.md, because the release job publishes `[Unreleased]` verbatim
      # as the GitHub Release notes. A step in `test` rather than its own job, so
      # the already-required check keeps covering it and branch protection needs
      # no change. The file list comes from the API, not git: no job here sets
      # `fetch-depth`, so the runner's checkout is shallow and `base...head` is
      # not resolvable locally.
      - name: Changelog entry
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pipefail: the default shell is `bash -e` without it, so a failing
          # `gh api` would be masked by the exit code of the script it pipes into.
          set -o pipefail
          # CHANGELOG.md at the MERGE BASE, for the preservation half of the gate
          # (does this PR still have everyone else's [Unreleased] entries?).
          #
          # The merge base, not the base branch tip: entries added to main after
          # this branch diverged were never on the branch, so their absence is
          # not a deletion, and comparing against the tip would fail every branch
          # that has not just been rebased — the long-lived Renovate ones first.
          # The #458 case is still caught, because an "Update branch" merge
          # commit makes main an ancestor of the head, so the merge base *is* the
          # tip and the dropped entry is unambiguously a deletion.
          #
          # Both calls go to the API for the same reason the file list does: no
          # job here sets `fetch-depth`, so neither commit is in the local object
          # store. `Accept: …raw` returns the file body directly, avoiding the
          # base64 `.content` field and its embedded newlines. The result is
          # passed to the script by PATH, never a second pipe — there is one
          # fd 0 and check-changelog.ts has broken on it twice.
          MERGE_BASE="$(gh api \
            "repos/${{ github.repository }}/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.merge_base_commit.sha')"
          gh api "repos/${{ github.repository }}/contents/CHANGELOG.md?ref=$MERGE_BASE" \
            -H 'Accept: application/vnd.github.raw' \
            > "$RUNNER_TEMP/changelog-base.md"
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' \
            | CHANGELOG_STDIN=1 \
              CHANGELOG_BASE_FILE="$RUNNER_TEMP/changelog-base.md" \
              npm run changelog:check --silent

  # Split from `test` (#306): the integration suite is DB-bound (~4.5 min) and
  # was the long pole of the required check. Running it in parallel cuts the
  # merge-gate critical path to the cheap gates. NOTE: branch protection must
  # require BOTH `test` and `integration` for the gate to keep covering it.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stellar
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: stellar
        ports:
          - 5432:5432
        # PGDATA on tmpfs: the CI database is disposable, so durability buys
        # nothing here, and the integration suite's cost is dominated by
        # TRUNCATE — relation-file work and fsync. Keeping it in RAM removes the
        # disk-I/O sensitivity that inflated one run to 68 minutes against a
        # 6-11 minute baseline (#458).
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1024m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STELLAR_PSQL_URI: postgresql://stellar:changeme@localhost:5432/stellar
      STELLAR_PSQL_URI_TEST: postgresql://stellar:changeme@localhost:5432/stellar_test
      STELLAR_AUTH_JWT_SECRET: ci-only-not-a-secret-pad-to-32-chars
      STELLAR_HTTP_PORT: 8080
      STELLAR_HTTP_CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Integration tests
        run: npm run test:integration

  # Build the real image and prove it self-migrates a fresh DB and boots — the
  # class of break where a merged-but-unapplied migration leaves the runtime
  # schema behind (see docker-entrypoint.sh). Gates publish.
  smoke:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t stellar-api:smoke .
      - name: Boot-and-migrate against a fresh database
        run: |
          set -euo pipefail
          docker network create stellar-smoke
          docker run -d --name pg --network stellar-smoke \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=stellar \
            postgres:16-alpine
          echo "Waiting for Postgres..."
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -q && break
            sleep 1
          done
          docker run -d --name api --network stellar-smoke -p 8080:8080 \
            -e STELLAR_PSQL_URI=postgresql://postgres:postgres@pg:5432/stellar \
            -e STELLAR_AUTH_JWT_SECRET=smoke_ci_jwt_secret_at_least_32_chars_long \
            stellar-api:smoke
          echo "Waiting for /health..."
          healthy=0
          for _ in $(seq 1 30); do
            if wget -qO- http://localhost:8080/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::API never became healthy"; docker logs api; exit 1
          fi
          # Definitive check: the entrypoint actually applied migrations.
          applied=$(docker exec pg psql -U postgres -d stellar -tAc \
            "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          echo "Applied migrations: $applied"
          if [ "$applied" -lt 1 ]; then
            echo "::error::No migrations applied — container did not self-migrate"
            docker logs api; exit 1
          fi
          # Definitive check: the entrypoint also seeded the baseline, so a fresh
          # deploy is ready for /install rather than an empty DB (api#313).
          ranks=$(docker exec pg psql -U postgres -d stellar -tAc \
            "SELECT count(*) FROM user_ranks")
          echo "Seeded ranks: $ranks"
          if [ "$ranks" -lt 1 ]; then
            echo "::error::No ranks seeded — container did not self-seed on boot"
            docker logs api; exit 1
          fi
      - name: Teardown
        if: always()
        run: |
          docker rm -f api pg >/dev/null 2>&1 || true
          docker network rm stellar-smoke >/dev/null 2>&1 || true

  publish:
    needs: [test, integration, smoke]
    # Skipped on PRs, where every step below was a no-op: the build was discarded
    # unpushed and the GHCR login bought nothing. This does NOT leave the image
    # unvalidated pre-merge — `smoke` builds the same Dockerfile on PRs and boots
    # it against a fresh DB, which is the gap stellar-ui#186 reports on that repo.
    # Keep `smoke` running on pull_request or this becomes that bug.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Tagging alone does not produce a GitHub Release, and creating one by hand was
  # a habit rather than a step — it lapsed after v0.5.6, which then sat advertised
  # as "Latest" on the repo page through nine subsequent versions. Automated here
  # so the tag is the only manual act.
  #
  # `needs: [publish]` deliberately: a Release announces an artifact, so it must
  # not exist for a version whose image never reached GHCR.
  release:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the Release from its CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Headings are `## [x.y.z] — date`, but older ones use a hyphen instead
          # of an em dash, so match the bracketed version and nothing after it.
          # Dots are escaped or `0.8.1` would also match `0x8y1`.
          notes="$(awk -v ver="$version" '
            BEGIN { gsub(/\./, "\\.", ver) }
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          # Fail loudly rather than publishing an empty Release: a missing section
          # means the CHANGELOG was not updated for this tag, which is worth
          # knowing at release time.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section found for $version"
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
